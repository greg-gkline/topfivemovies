- item: top5/top-5-worst-sequels-of-all-time
  author: greg
  date: 2001-08-27
  text: Yes, Supe 4 was bad, way too preachy. That's what you get for letting Christopher Reeve write the screenplay. But how could you forget "From Dusk Til Dawn 2", or "Blues Brothers 2000"? The latter not only sucked balls, but also diminished the public memory of the original. Plus it had NO Belushis in it. What a rip.
- item: top5/top-5-historically-accurate-movies-of-all-time
  author: greg
  date: 2001-09-03
  text: How could you include "Thirteen Days" with all its "creative liberties", but leave off "Tora! Tora! Tora!", which was created with the cooperation of American and Japanese historians, and is dead accurate in practically every word of dialogue? It seems Mr. Bruce has not done his homework...
- item: top5/top-5-greatest-actors-who-had-mustaches
  author: jesse
  date: 2001-09-04
  text: WHAT?!? Tom Selleck only number 4?!? Bruce, you just may be the stupidest man on Earth... Selleck's mustache was WAY more talented than the whole Peter Sellers. Pathetic lack of respect for the greatest facial hair ever.
