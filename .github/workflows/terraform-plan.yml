name: terraform-plan

# Advisory: on a pull request that changes infra/, runs `terraform plan` and comments what
# it would change. It signs in as the read-only `topfivemovies-plan` IAM user (infra/iam.tf)
# with an access key from the secrets AWS_PLAN_ACCESS_KEY_ID and
# AWS_PLAN_SECRET_ACCESS_KEY of the "AWS 832474135782" GitHub environment, and plans with -lock=false so it never writes to the state
# bucket. Without those secrets the job does nothing: create them after the first apply
# (infra/README.md). A fork's pull request gets no secrets, so it does nothing either.
# The formatting, validation and security checks are the `terraform` job in validate.yml.
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # to comment the plan

jobs:
  plan:
    runs-on: ubuntu-latest
    # The AWS secrets belong to this environment, so only a job that names it can read them.
    # If the environment limits which branches can deploy to it, a pull request's branch
    # has to be allowed too, or the job is refused.
    environment: "AWS 832474135782"
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PLAN_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PLAN_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}   # empty if unset, which plans the alerts as off
    steps:
      - id: keys
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No AWS_PLAN_* secrets here (not set yet, or a fork): skipping the plan."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.keys.outputs.present == 'true'
      - uses: hashicorp/setup-terraform@v4
        if: steps.keys.outputs.present == 'true'
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Init
        if: steps.keys.outputs.present == 'true'
        run: terraform -chdir=infra init -input=false
      - name: Plan
        if: steps.keys.outputs.present == 'true'
        id: plan
        run: |
          set +e
          terraform -chdir=infra plan -input=false -lock=false -no-color -detailed-exitcode > plan.txt 2>&1
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          # 0: no changes, 2: changes, 1: error
          [ "$code" -ne 1 ]
        continue-on-error: true
      - name: Comment
        if: steps.keys.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXIT: ${{ steps.plan.outputs.exit }}
        run: |
          case "$EXIT" in
            0) status="No changes." ;;
            2) status="The plan has changes." ;;
            *) status="**The plan failed.**" ;;
          esac
          {
            echo "### Terraform plan"
            echo
            echo "$status Nothing is applied from here: run \`terraform apply\` from \`infra/\` after the merge (see infra/README.md)."
            echo
            echo "<details><summary>Plan output</summary>"
            echo
            echo '````'
            tail -c 55000 plan.txt
            echo '````'
            echo "</details>"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/github/pr_comment.py --marker terraform-plan --body-file comment.md
      - name: Fail if the plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
