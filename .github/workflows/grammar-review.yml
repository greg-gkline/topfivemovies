name: grammar-review

# Advisory: wrong-word and grammar findings (to/too/two, its/it's, then/than) on the lines
# a pull request changes in content/ and data/, from LanguageTool and Harper. Which rules
# count is in scripts/prose/rules.json. Findings are posted as a pull request review with
# suggestions, and listed in the job summary. The review only comments, and the job never
# fails because of a finding, so this stays out of branch protection until it has proven
# useful. It needs no secret of its own. On a fork the token is read-only, so there the
# findings are warnings on the lines instead.
on:
  pull_request:
    paths:
      - "content/**"
      - "data/**"
      - "scripts/prose/**"
      - ".github/workflows/grammar-review.yml"

permissions:
  contents: read
  pull-requests: write   # to post the review

jobs:
  grammar-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}   # the commit the review comments on
          fetch-depth: 0   # the diff against the merge base
      - name: Check changed lines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 -I scripts/prose/grammar.py --base "$BASE" --max-files 50
