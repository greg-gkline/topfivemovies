name: validate

# The required `validate` check. Every job below feeds the one called `validate` at the
# bottom, so branch protection needs only that name:
#   content     schema, YAML lint and cross-reference checks (scripts/content/validate.sh)
#   build       the Hugo build, kept as an artifact for the jobs that follow
#   html-links  HTML validation (vnu) and the internal link check (scripts/quality/check.sh)
#   a11y        axe on every page, and lighthouse for the performance budgets
#               (scripts/quality/lighthouserc.json)
#   terraform   fmt, validate, tflint and checkov on infra/
# The accessibility and Lighthouse jobs run only when the design or the checks change
# (DESIGN_PATHS below), and the Terraform job only when infra/ changes (INFRA_PATHS).
# They are skipped jobs rather than a path filter on the workflow, so `validate` still
# reports a status that a required check can rely on.
# `preview` is not part of `validate`: on a pull request it screenshots the pages the
# content changes affect and publishes the images as an artifact (scripts/preview/).
# The parity diff (scripts/parity/) is not run here: it compares with the legacy
# site, so it is run by hand during the cutover, not on every change.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUGO_VERSION: 0.147.9   # also pinned in .devcontainer/devcontainer.json
  # Templates, styles, scripts and theme images, the site configuration, and the
  # checks themselves
  DESIGN_PATHS: assets layouts static hugo.yaml scripts/quality .github/workflows/validate.yml
  # Terraform and its checks
  INFRA_PATHS: infra .github/workflows/validate.yml

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install tools
        run: pip install check-jsonschema==0.38.2 yamllint==1.37.1 PyYAML==6.0.2
      - name: Validate
        run: scripts/content/validate.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Hugo
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Build
        run: hugo --gc --panicOnWarning
      - uses: actions/upload-artifact@v7
        with:
          name: public
          path: public/
          retention-days: 7

  # Whether anything under DESIGN_PATHS changed: in the pull request, or in the push.
  changes:
    runs-on: ubuntu-latest
    outputs:
      design: ${{ steps.diff.outputs.design }}
      infra: ${{ steps.diff.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A push with no usable base (a new branch, a force push) counts as a change.
          usable=false
          git cat-file -e "$BASE^{commit}" 2>/dev/null && usable=true
          for group in design:"$DESIGN_PATHS" infra:"$INFRA_PATHS"; do
            name=${group%%:*} paths=${group#*:}
            if $usable && git diff --quiet "$BASE" HEAD -- $paths; then
              echo "$name=false" >> "$GITHUB_OUTPUT"
              echo "No $name changes: skipping its checks."
            else
              echo "$name=true" >> "$GITHUB_OUTPUT"
              git diff --stat "$BASE" HEAD -- $paths 2>/dev/null || true
            fi
          done

  # HTML validation (vnu, on the runner's Java) and the internal link check. They run on
  # every change, since content can break links and markup too. The tools are pinned and
  # checksummed in tools.sh.
  html-links:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: public
          path: public/
      - name: Check
        run: NO_BUILD=1 scripts/quality/check.sh html links

  # axe on every page, in the runner's Chrome.
  a11y:
    needs: [build, changes]
    if: needs.changes.outputs.design == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: public
          path: public/
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Selenium
        run: pip install selenium==4.49.0
      - name: Check
        run: NO_BUILD=1 scripts/quality/check.sh a11y

  lighthouse:
    needs: [build, changes]
    if: needs.changes.outputs.design == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: public
          path: public/
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun --config=scripts/quality/lighthouserc.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: .cache/lighthouse/
          retention-days: 7

  # fmt, validate (without the backend, so no AWS access), tflint and checkov. The tools
  # are pinned; the versions match the devcontainer.
  terraform:
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Format
        run: terraform -chdir=infra fmt -check -recursive -diff
      - name: Validate
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # to download the AWS ruleset without a rate limit
        run: |
          tflint --chdir=infra --init
          tflint --chdir=infra
      - name: checkov
        run: |
          pip install checkov==3.3.28
          checkov -d infra --quiet --compact

  # Screenshots of the pages the pull request's content and data changes affect, from the
  # same build, as an artifact of PNGs at desktop and phone width. Not part of `validate`.
  # A fork's token cannot comment, so there the images are only in the artifact.
  preview:
    if: github.event_name == 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # to comment the link
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the diff against the merge base
      - uses: actions/download-artifact@v8
        with:
          name: public
          path: public/
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Hugo and Selenium
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
          pip install selenium==4.49.0
      - name: Screenshot the changed pages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/preview/preview.py --base "$BASE" --out preview
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: preview
          path: preview/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### Preview of the changed pages"
            echo
            if [ -n "$ARTIFACT_URL" ]; then
              echo "**[Download the screenshots]($ARTIFACT_URL)**: full-page PNGs at desktop and phone width, kept 14 days."
              echo
            fi
            cat preview/summary.md
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/github/pr_comment.py --marker preview --body-file comment.md

  # The one name branch protection requires. A skipped job (the design-only ones) counts
  # as passing; a failed or cancelled one does not.
  validate:
    needs: [content, build, html-links, a11y, lighthouse, terraform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
