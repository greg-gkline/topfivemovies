{{ define "main" }}
<h2 class="pageheader">{{ .Title }}</h2>

{{ .Content }}

<div id="pollarchive">
	{{- range sort site.Data.polls "date" "desc" }}
	<div class="poll">
		<div class="polldate">{{ (time.AsTime .date).Format "January 02, 2006" }}</div>
		{{ partial "poll-results.html" (dict "poll" . "page" $ "barwidth" 300) }}
	</div>
	{{- end }}
</div>
{{ end }}
