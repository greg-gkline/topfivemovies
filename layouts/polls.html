{{ define "main" }}
<h1 class="pageheader">{{ .Title }}</h1>

{{ .Content }}

<div class="pollarchive">
	{{- range sort site.Data.polls "date" "desc" }}
	<section class="poll">
		{{- $date := time.AsTime .date }}
		<h2 class="polldate"><time datetime="{{ $date.Format "2006-01-02" }}">{{ $date.Format "January 02, 2006" }}</time></h2>
		{{ partial "poll-results.html" (dict "poll" . "page" $ "barwidth" 300) }}
	</section>
	{{- end }}
</div>
{{ end }}
