{{- with partial "neighbors.html" . }}
<div class="prevnext">
	{{- with .next }}
	<a class="next" href="{{ .RelPermalink }}" rel="next">Next: {{ .Title }} &raquo;</a>
	{{- end }}
	{{- with .prev }}
	<a class="prev" href="{{ .RelPermalink }}" rel="prev">&laquo; Previous: {{ .Title }}</a>
	{{- end }}
</div>
{{- end }}
